version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kamicod-t3-agents_server_1
      APP_PORT: 3773

  server:
    image: ghcr.io/kamicod/umbrel-t3-agents:v1.0.0
    hostname: umbrel-pi
    restart: on-failure
    init: true
    stop_grace_period: 1m
    user: "1000:1000"
    extra_hosts:
      - "umbrel.local:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Africa/Casablanca
      UMBREL_LOCAL_HOSTS: host.docker.internal,umbrel.local
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/node
      - ${APP_DATA_DIR}/data/projects:/workspace
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
